version: '3.8'

services:
  fastrtc-voice-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fastrtc-groq-voice-agent
    ports:
      - "7860:7860" # Gradio UI
    environment:
      # Load from .env file or set directly here
      - CARTESIA_API_KEY=${CARTESIA_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
    env_file:
      - .env
    volumes:
      # Optional: Mount code for development
      # - ./app.py:/app/app.py
      # - ./websearch_agent.py:/app/websearch_agent.py
    restart: unless-stopped
    # For phone interface, uncomment below and comment out the default command
    # command: ["python", "app.py", "--phone"]
